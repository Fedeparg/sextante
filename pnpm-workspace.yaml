packages:
  - 'apps/*'
  # Pure logic shared by the frontend and the API (see packages/core).
  - 'packages/*'

# We force patched versions of transitive dependencies with security advisories
# (see `pnpm audit`). None is really reachable from this code, but as a matter of
# hygiene we bump them to the patched version without a major jump (API
# compatibility):
#   - esbuild/postcss/vite: build/dev/test tooling only (vite comes in through vitest).
#   - multer: transitive via @nestjs/platform-express; there are no upload routes.
#   - js-yaml (via gray-matter): only parses frontmatter of trusted Markdown.
# Not forced: postcss-selector-parser 6.0.10 (GHSA-rj75-hqrm-r3gf, fixed only in 7.1.6).
# @tailwindcss/typography pins that exact version and only runs it at build time over
# our own CSS, so forcing a major jump would risk the build for no reachable gain.
overrides:
  esbuild: '>=0.24.3'
  postcss: '>=8.5.10'
  vite: '^8.1.6'
  multer: '>=2.5.0'
  gray-matter>js-yaml: '^3.15.2'
  # qs (via @modelcontextprotocol/sdk > express > body-parser): two denial-of-service
  # advisories when parsing query strings. The API does receive query strings from
  # the network, so this one is reachable.
  qs: '^6.16.0'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  # OPTIONAL native deps of testcontainers/dockerode (SSH transport). The tests use
  # the local Docker socket, not SSH, so there is no need to build them.
  cpu-features: false
  protobufjs: false
  ssh2: false
  esbuild: true
  sharp: true
  unrs-resolver: true
